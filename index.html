                <div class="item-details">
                    <span class="item-name">${item.id ? item.id + '. ' : ''}${item.name}</span>
                    <span class="item-desc">${item.desc}</span>
                    <span class="price">${item.price.toFixed(2)}€</span>
                </div>
                <button class="add-btn" onclick="addToCart('${item.name.replace(/<[^>]*>?/gm, '')}', ${item.price})">+</button>
            `;
            container.appendChild(div);
        });
    });
}

function addToCart(name, price) {
    cart.push({ name, price, note: "" });
    updateCartUI();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
}

function updateNote(index, value) {
    cart[index].note = value;
}

function updateCartUI() {
    const cartBox = document.getElementById('cart-container');
    const itemsList = document.getElementById('cart-items');
    const totalSpan = document.getElementById('total-price');
    
    if (cart.length === 0) {
        cartBox.style.display = 'none';
        return;
    }
    
    cartBox.style.display = 'block';
    itemsList.innerHTML = '';
    let total = 0;
    
    cart.forEach((item, index) => {
        total += item.price;
        itemsList.innerHTML += `
            <div style="margin-bottom:15px;">
                <div class="cart-item">
                    <span><strong>${item.name}</strong></span>
                    <span>${item.price.toFixed(2)}€ <button class="remove-btn" onclick="removeFromCart(${index})">✕</button></span>
                </div>
                <input type="text" class="note-input" placeholder="Wünsche (z.B. ohne Zwiebeln, Extra Käse...)" 
                    oninput="updateNote(${index}, this.value)" value="${item.note}">
            </div>
        `;
    });
    totalSpan.textContent = total.toFixed(2);
}

function sendWhatsApp() {
    const phone = "+49015257029115"; 
    let text = "*Neue Bestellung *%0A--------------------------%0A";
    
    cart.forEach(item => {
        text += `• *${item.name}* (${item.price.toFixed(2)}€)%0A`;
        if(item.note) text += `  _Notiz: ${item.note}_%0A`;
    });
    
    const total = document.getElementById('total-price').textContent;
    text += `--------------------------%0A*Gesamtbetrag: ${total}€*%0A%0A_Bitte bestätigen Sie meine Bestellung._`;
    
    window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
}
